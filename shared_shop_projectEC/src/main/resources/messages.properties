# 注文内容確認処理時に在庫数が注文数より少なかった場合のメッセージ（在庫数1以上）
stock.lessThan=は、在庫不足のため、在庫数分のみ注文できます。
msg.basket.stock.short={0}は、在庫不足のため在庫数分のみ注文できます。
msg.basket.stock.none={0}は、在庫切れです。他の商品を選択してください。

# 注文内容確認処理時に在庫数が注文数より少なかった場合のメッセージ（在庫数0）
stock.zero=は、在庫切れのため注文できません。