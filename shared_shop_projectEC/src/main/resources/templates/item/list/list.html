<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">

<head>
	<title>商品一覧 | シェアードショップ</title>
	<meta charset="UTF-8" />
</head>

<body th:object="${loginForm}" class="user item_list">

	<h2 th:class="title" th:text="#{item}+#{title.list}"></h2>

	<div class="sorted_by">	
		<!--/* 商品一覧新着順 */-->
		<span th:if="${isSearch && sortType == 1}" th:text="#{sort.latest.str}"></span>
		<a th:if="${isSearch && sortType != 1}" th:href="@{/item/list/1}"
			th:text="#{sort.latest.str}"></a>
			
		<!--/* 商品一覧売れ筋順 */-->
		<span th:if="${isSearch && sortType == 2}" th:text="#{sort.hotsell.str}"></span>
		<a th:if="${isSearch && sortType != 2}" th:href="@{/item/list/2}"
			th:text="#{sort.hotsell.str}"></a>
			
		<!--/* カテゴリ検索後、新着順 */-->
		<span th:if="${isCategorySearch && sortType == 1}" th:text="#{sort.latest.str}"></span>
		<a th:if="${isCategorySearch && sortType != 1}" th:href="@{/item/list/category/1(categoryId=${categoryId})}"
			th:text="#{sort.latest.str}"></a>
			
		<!--/* カテゴリ検索後、売れ筋順 */-->
		<span th:if="${isCategorySearch && sortType == 2}" th:text="#{sort.hotsell.str}"></span>
		<a th:if="${isCategorySearch && sortType != 2}" th:href="@{/item/list/category/2(categoryId=${categoryId})}"
			th:text="#{sort.hotsell.str}"></a>	
	</div>


	<th:block th:if="!${#lists.isEmpty(items)}">
		<table class="list_table item_detail">
			<tr>
				<th th:text="#{data.item.image}"></th>
				<th th:text="#{data.item.name}"></th>
				<th th:text="#{data.item.price}"></th>
				<th th:text="#{data.category}"></th>
			</tr>
			<!--/* 商品一覧 */-->
			<tr th:each="item, status: ${items}">
				<td class="image">
					<img th:src="@{/img/product/{image}(image=${item.image})}" th:if="${item.image != null}" />
					<img th:src="@{/img/common/no_image.jpg}" th:if="${item.image == null}" />

				</td>
				<td><a th:href="@{/item/detail/{id}(id=${item.id})}" th:text="${item.name}"></a></td>
				<td th:text="${item.price}"></td>
				<td th:text="${item.categoryName}"></td>
			</tr>
		</table>
	</th:block>

</body>

</html>
