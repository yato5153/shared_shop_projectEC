<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">

<head>
	<script th:src="@{/js/payment_input.js}" type="text/javascript"></script>
	<title>お支払い方法選択 | シェアードショップ</title>
	<meta charset="UTF-8" />
</head>

<body class="user order_payment_input">

	<h2 class="title">お支払い方法選択</h2>
	<p class="err" th:if="${quantityError != null}" th:text="${quantityError}">
	</p>

	<div class="user_info_form_area">

		<!-- 支払い方法・クーポン選択 -->
		<form method="post" th:action="@{/order/check}" th:object="${orderForm}">

			<ul class="payment_method_select">

				<li>
					<label class="radio_label">
						<input type="radio" name="payMethod" value="1"
							th:checked="${orderForm.payMethod == null or orderForm.payMethod == 1}"
							onclick="payChange();" />
						クレジットカード
					</label>
				</li>

				<li>
					<label class="radio_label">
						<input type="radio" name="payMethod" value="2" th:checked="${orderForm.payMethod == 2}"
							onclick="payChange();" />
						銀行振り込み
					</label>
				</li>

				<li>
					<label class="radio_label">
						<input type="radio" name="payMethod" value="3" th:checked="${orderForm.payMethod == 3}"
							onclick="payChange();" />
						着払い
					</label>
				</li>

				<li>
					<label class="radio_label">
						<input type="radio" name="payMethod" value="4" th:checked="${orderForm.payMethod == 4}"
							onclick="payChange();" />
						電子マネー
					</label>
				</li>

				<li>
					<label class="radio_label">
						<input type="radio" name="payMethod" value="5" th:checked="${orderForm.payMethod == 5}"
							onclick="payChange();" />
						コンビニ決済
					</label>
				</li>

			</ul>

			<span th:if="${#fields.hasErrors('payMethod')}" th:errors="*{payMethod}"></span>

			<!-- クーポン選択機能 -->
			<div class="coupon_select_area">

				<h3>クーポン選択</h3>

				<p>使用するクーポンを1枚選択してください。</p>

				<!-- クーポンを使用しない -->
				<div>
					<label class="radio_label">
						<input type="radio" name="userCouponId" value=""
							th:checked="${orderForm.userCouponId == null}" />
						クーポンを使用しない
					</label>
				</div>

				<!-- 利用可能なクーポン -->
				<div th:each="userCoupon : ${availableCoupons}">

					<label class="radio_label">
						<input type="radio" name="userCouponId" th:value="${userCoupon.id}"
							th:checked="${orderForm.userCouponId == userCoupon.id}" />

						<span th:text="${userCoupon.coupon.couponsName}"></span>

						（
						<span th:text="${userCoupon.coupon.discountRate}"></span>
						%OFF）
					</label>

				</div>

				<!-- 利用可能なクーポンがない場合 -->
				<p th:if="${#lists.isEmpty(availableCoupons)}">
					現在利用できるクーポンはありません。
				</p>

				<!-- クーポンエラー -->
				<p th:if="${couponError != null}" th:text="${couponError}" style="color: red;"></p>

			</div>

			<!-- お届け先情報の引き継ぎ -->
			<div id="card" class="card_info">

				<input type="hidden" name="postalCode" th:value="${orderForm.postalCode}" />

				<input type="hidden" name="address" th:value="${orderForm.address}" />

				<input type="hidden" name="name" th:value="${orderForm.name}" />

				<input type="hidden" name="phoneNumber" th:value="${orderForm.phoneNumber}" />

			</div>

			<input type="submit" class="send_button" value="次へ" />

		</form>

		<!-- お届け先入力画面に戻る -->
		<form method="post" th:action="@{/address/input}" class="update">

			<input type="hidden" name="backFlg" value="true" />

			<input type="hidden" name="postalCode" th:value="${orderForm.postalCode}" />

			<input type="hidden" name="address" th:value="${orderForm.address}" />

			<input type="hidden" name="name" th:value="${orderForm.name}" />

			<input type="hidden" name="phoneNumber" th:value="${orderForm.phoneNumber}" />

			<input type="submit" class="back_button" value="戻る" />

		</form>

	</div>

</body>

</html>
