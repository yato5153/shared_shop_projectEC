<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">

<head>
	<title>クーポン一覧 | シェアードショップ</title>
	<meta charset="UTF-8" />
</head>
<body class="user_coupon">
	<h2 class="title">
		クーポン一覧
	</h2>
	<div th:if="${couponFalse}">
		<p th:text="#{itemList.none}"></p>
	</div>
	<div class="user_coupon_display">
    	<th:block th:each="couponName, status : ${couponNames}"
			th:if="${status.count le 10}">
        	<img th:src="@{'/img/coupon/' + ${couponName} + '.png'}"
             	alt="クーポン画像" />
    	</th:block>
	</div>
</body>
</html>
