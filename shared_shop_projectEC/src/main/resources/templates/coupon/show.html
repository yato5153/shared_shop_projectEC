<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">

<head>
	<title>クーポン一覧 | シェアードショップ</title>
	<meta charset="UTF-8" />
</head>
<body class="user_coupon">
	<h2 class="title">
		クーポン一覧
	</h2>
	<div th:if="${#lists.isEmpty(items)}">
		<p th:text="#{itemList.none}"></p>
	</div>
	<div class="user_coupon_display">
		<th:block th:if="${someOtherCondition}">
  			<span th:each="coupon, status : ${couponList}" th:if="${status.count <= 10}">
	 
				<img th:src="@{'/images/coupon/' + ${coupon.couponsName} + '.png'}"
					alt="クーポン画像" width="100" />
					
			</span>
		</th:block>
	</div>
</body>
</html>
