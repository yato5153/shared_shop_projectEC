<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">

<head>
	<title>クーポン一覧 | シェアードショップ</title>
	<meta charset="UTF-8" />
</head>
<body class="user coupon">
	<h2 class="title">
		クーポン一覧
	</h2>
	<div th:if="${#lists.isEmpty(items)}">
		<p th:text="#{itemList.none}"></p>
	</div>
	<div class="item_display">
	<th:block th:each="item, status: ${items}" th:if="${status.count le 10}">
		<!--/* 1件分の商品情報 */-->
		<div class="item">
			<div class="item_name" th:text="${item.name}"></div>
			<a th:href="@{/item/detail/}+${item.id}">
			    <img th:src="@{/img/{image}(image=${item.image})}" th:if="${item.image != null}" />
			    <img th:src="@{/img/common/no_image.jpg}" th:if="${item.image == null}" />
			</a>
		</div>
	</th:block>
	</div>
</body>
</html>
